# The API, on Render's free web service. See ADR-0006 (everything runs on a free tier).
#
# The free instance spins down after ~15 minutes of inactivity and takes 30 to 60 seconds to
# wake. That is a real property of the product, not a footnote: the dashboard has to handle a
# cold start honestly rather than showing a broken page, and the sprint demo should wake the
# service before it starts.
services:
  - type: web
    name: seo-agent-api
    runtime: node
    plan: free
    region: oregon

    # Build from the monorepo root: the API depends on five workspace packages, and pnpm
    # needs the lockfile and the workspace manifest to resolve them.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/api/dist/server.js

    # Migrations are NOT run here, and that is deliberate rather than an omission.
    #
    # `preDeployCommand` is where they belong and is available only on paid instance types; on
    # `plan: free` it is ignored, which would make it a fix that looks applied and does nothing.
    # Putting them in `startCommand` works on any plan and taxes the wrong thing: this instance
    # spins down after ~15 minutes and cold-starts constantly, and a database round trip on every
    # wake is a poor price for a schema change that happens a few times a sprint.
    #
    # They run in .github/workflows/migrate.yml instead, once per merge to main. See that file for
    # the outage that put it there.

    # Render polls this. It must not require a token, or the service is marked unhealthy and
    # restarted forever.
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: 24
      # Measured on the live service on 2026-09-26 (#199). Every request reaches the process from a
      # local proxy on 127.0.0.1, and X-Forwarded-For arrives as
      #   [anything the client wrote], client, Cloudflare edge, Render load balancer (10.x)
      # Render appends and keeps client-written entries, so the client is exactly three hops back
      # from our side and the entries a client writes are never reached. See AppOptions.trustProxyHops.
      - key: TRUSTED_PROXY_HOPS
        value: '3'
      # Set in the Render dashboard, never here. This is the owner credential and it carries
      # BYPASSRLS (ADR-0008).
      - key: DATABASE_URL
        sync: false
      # The web app's origin, so CORS admits it and nothing else.
      - key: WEB_URL
        sync: false
      # Encrypts Google refresh tokens at rest, and signs the OAuth callback state
      # (ADR-0003, ADR-0009). Generate with: openssl rand -base64 32
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Google OAuth for Search Console. Set in the dashboard, never here. The redirect URI
      # must be this service's public /auth/google/callback and match the Cloud console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      # GitHub App, for connecting a repo and opening pull requests (ADR-0002). Set in the
      # dashboard, never here. GH_APP_*, not GITHUB_*, because GitHub Actions reserves that
      # prefix and the worker reads the same names from its secrets. Without all four, the
      # connect and webhook routes report 503 and the rest of the API runs fine.
      - key: GH_APP_ID
        sync: false
      - key: GH_APP_PRIVATE_KEY
        sync: false
      - key: GH_APP_WEBHOOK_SECRET
        sync: false
      # The App's public URL slug (github.com/apps/<slug>). Not a secret, but set here too so
      # the install URL can be built.
      - key: GH_APP_SLUG
        sync: false
      # The App's user-to-server OAuth credentials, which is what "Sign in with GitHub" uses
      # (ADR-0023). A different pair from GH_APP_ID / GH_APP_PRIVATE_KEY above: those are how the
      # App acts as itself to open pull requests, these are how a person proves who they are.
      # Without both, the login page simply shows no GitHub button.
      - key: GH_APP_CLIENT_ID
        sync: false
      - key: GH_APP_CLIENT_SECRET
        sync: false
      # What a tenant created by a social sign-in may spend per month, in micro-dollars.
      # This deployment is open, so this is the bound on what a stranger can spend on our keys.
      # 0 leaves everything free working and spends nothing. Unset means the column default, 0.
      - key: NEW_TENANT_BUDGET_MICROS
        sync: false
      # The deployment-wide monthly cap on paid work, in micro-dollars, shared by every tenant.
      # Zero or unset refuses every model and SEO-data call. The worker needs the same value as a
      # GitHub Actions variable.
      - key: GLOBAL_MONTHLY_BUDGET_MICROS
        sync: false
      # DataForSEO, for keyword research on /keywords and the MCP keyword_ideas tool.
      #
      # The API needs these as well as the worker: the worker uses the same vendor for backlinks
      # during an audit, this service uses it for keyword ideas during a request. Absent, the
      # route answers with an empty list and a note saying it is not configured, which is the
      # posture every paid surface takes (ADR-0016, ADR-0021).
      #
      # The password here is the vendor's **API password** from app.dataforseo.com/api-access,
      # not the account login password. They are different strings and the account one returns
      # 40100 on every call.
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false

      # API_PUBLIC_URL is deliberately NOT listed.
      #
      # Render sets RENDER_EXTERNAL_URL automatically on every web service, and the API prefers
      # it, so the OAuth redirect configures itself here with nothing to forget. Set
      # API_PUBLIC_URL only if this service is ever fronted by a custom domain, in which case the
      # value registered on the GitHub App and the Google OAuth client is that domain and not the
      # onrender.com one.
