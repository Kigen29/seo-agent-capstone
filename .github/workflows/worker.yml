# Free worker fleet. See ADR-0006.
# Public repo = unlimited Actions minutes. Chromium is preinstalled. 6h job limit.
name: worker

on:
  # The API fires this via the GitHub REST API when a job is enqueued in pg-boss.
  repository_dispatch:
    types: [run-jobs]
  # Safety net: drain the queue every 15 minutes regardless.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      queue:
        description: 'Which queue to drain (crawl | audit | poll-ai | fix | verify | all)'
        required: false
        default: 'all'

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json. Do not also pin it here:
      # the action errors on two sources of truth.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The worker runs compiled JS (node dist/drain.js), and dist/ is gitignored, so it must
      # be built here. Only the worker and the packages it depends on: the full `pnpm build` also
      # built the Next.js web app, which the drain never loads, and cost most of a minute per run.
      - run: pnpm turbo run build --filter=@seo/worker...

      # Chromium is the same download every run for a given Playwright version, so cache it,
      # keyed on the lockfile (which pins that version). The system libraries it needs ship with
      # the ubuntu-latest image; --with-deps only runs when the cache missed, as a safety net.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # playwright is a dependency of @seo/crawler, not of the root, so its binary is not on
      # the root's node_modules/.bin. Running the install from the root ("pnpm exec playwright")
      # fails with "Command playwright not found". Run it through the package that owns it.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @seo/crawler exec playwright install --with-deps chromium

      # Prove the (possibly cached) browser actually starts before any audit depends on it. If a
      # runner image ever lacks a system library, install them rather than failing every crawl.
      - name: Check Chromium launches
        working-directory: packages/crawler
        run: |
          node -e "require('playwright').chromium.launch().then((b) => b.close())"             || (pnpm exec playwright install-deps chromium               && node -e "require('playwright').chromium.launch().then((b) => b.close())")

      - name: Drain the queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_FAST: ${{ vars.LLM_FAST }}
          LLM_SMART: ${{ vars.LLM_SMART }}
          LLM_EMBED: ${{ vars.LLM_EMBED }}
          LLM_JUDGE: ${{ vars.LLM_JUDGE }}
          # The deployment-wide monthly cap on paid work, in micro-dollars. Every model, SERP and
          # DataForSEO call reserves against it, and an unset or zero cap refuses them all, so
          # without this line the worker could never spend even with keys configured.
          GLOBAL_MONTHLY_BUDGET_MICROS: ${{ vars.GLOBAL_MONTHLY_BUDGET_MICROS }}
          # The answer engine the AI-visibility axis polls. Unset on purpose until an operator
          # opts in: this is the one role that spends every day, per prompt, per site, and an
          # unset chain darkens that axis honestly rather than starting a recurring bill.
          LLM_POLL: ${{ vars.LLM_POLL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Needed by googleOAuthConfigFromEnv even though the refresh call does not send it;
          # the verify job refreshes the tenant's token before calling Search Console.
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          # The SERP vendor, for Google AI Overviews on the visibility poll and (next) brand
          # mentions on the authority axis. The only per-query paid dependency in the product:
          # unset means those two axes stay honestly unmeasured rather than spending (ADR-0016),
          # and every query that does happen passes the per-tenant budget guard first (ADR-0017).
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERP_COUNTRY: ${{ vars.SERP_COUNTRY }}
          SERP_COST_PER_QUERY_USD: ${{ vars.SERP_COST_PER_QUERY_USD }}
          # The backlink index, for referring domains and the unlinked-mention finding on the
          # authority axis (ADR-0021). Off by default like SerpApi: unset means the axis reports
          # referring domains as unmeasured rather than as a zero, which is the one distinction
          # that matters there. The cost variable feeds the per-tenant budget guard, so leaving
          # it unset would record spend as free and quietly disarm the cap (ADR-0017).
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          DATAFORSEO_USE_SANDBOX: ${{ vars.DATAFORSEO_USE_SANDBOX }}
          BACKLINK_COST_PER_QUERY_USD: ${{ vars.BACKLINK_COST_PER_QUERY_USD }}
          GOOGLE_PSI_API_KEY: ${{ secrets.GOOGLE_PSI_API_KEY }}
          GOOGLE_CRUX_API_KEY: ${{ secrets.GOOGLE_CRUX_API_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          # The GitHub App, so the verify job can open the pull request (ADR-0002).
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          QUEUE: ${{ github.event.inputs.queue || 'all' }}
        # Claims jobs from pg-boss, runs them, writes results back, exits when the queue is empty.
        run: pnpm --filter @seo/worker drain
